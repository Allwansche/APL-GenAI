<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>AI Dashboard</title>
</head>
<body>
    <h1>AI Matplan Dashboard</h1>

    <h2>Sammanfattning</h2>
    <p>Dagar: {{ days }}</p>
    <p>Kalorimål: {{ calories }}</p>

    <h2>Plan</h2>

    {% for day in plan %}
        <h3>Dag {{ day.day }} — Totalt: {{ day.total_calories }} kcal</h3>

        <ul>
            {% for meal in day.meals %}
                <li>
                    <strong>{{ meal.type }}:</strong> {{ meal.name }}  
                    ({{ meal.calories }} kcal)
                </li>
            {% endfor %}
        </ul>
    {% endfor %}
</body>
</html>
