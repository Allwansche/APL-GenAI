<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>AI Matplanerare</title>
</head>
<body>
    <h1>AI Matplanerare</h1>

    <form method="post">
        {% csrf_token %}
        <label>Dagar:</label>
        <input type="number" name="days" required><br><br>

        <label>Kalorier per dag:</label>
        <input type="number" name="calories" required><br><br>

        <label>Preferenser:</label><br>
        <textarea name="preferences"></textarea><br><br>

        <button type="submit">Generera</button>
    </form>

    <hr>

    {% if plan %}
        <h2>AI‑genererad matplan (rådata):</h2>
        <pre>{{ plan }}</pre>
    {% endif %}

    {% if error %}
        <h3>Fel:</h3>
        <pre>{{ error }}</pre>
    {% endif %}
</body>
</html>
